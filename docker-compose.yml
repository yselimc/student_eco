services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: student_eco
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_eco"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Inside the compose network the db is reachable via its service hostname, not localhost.
      # This overrides DATABASE_URL from backend/.env (which targets host Postgres for native dev).
      DATABASE_URL: postgresql+psycopg://student:student@db:5432/student_eco
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* must be available at build time (baked into the bundle).
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:

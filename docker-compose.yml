# Alternate local setup — NOT in active use by the default development flow.
# The project's DATABASE_URL points at the system Postgres on :5432 (see Day 2
# fix 8df217c). This compose file spins up a containerized Postgres on :5433
# for contributors who don't have a native Postgres install. To use it:
#   docker compose up -d
#   then set DATABASE_URL=postgresql+psycopg://student:student@localhost:5433/student_eco
# Otherwise leave it alone.
services:
  db:
    image: postgres:15
    container_name: student_eco_db
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: student_eco
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_eco"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

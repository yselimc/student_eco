services:
  db:
    image: postgres:15
    container_name: student_eco_db
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: student_eco
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d student_eco"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

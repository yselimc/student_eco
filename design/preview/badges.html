<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{padding:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:6px;font:600 12px var(--font-sans);border:1px solid transparent;line-height:20px}
.b-primary{background:#F5F3FF;color:#6D28D9;border-color:#DDD6FE}
.b-success{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
.b-warn{background:#FEF3C7;color:#B45309;border-color:#FDE68A}
.b-dest{background:#FEE2E2;color:#B91C1C;border-color:#FECACA}
.b-info{background:#DBEAFE;color:#1D4ED8;border-color:#BFDBFE}
.b-neutral{background:#F1F5F9;color:#334155;border-color:#E2E8F0}
.b-solid{background:#7C3AED;color:#fff}
.dot{width:6px;height:6px;border-radius:9999px;background:currentColor}
</style></head><body>
<span class="b b-primary">Yeni</span>
<span class="b b-success"><span class="dot"></span>Müsait</span>
<span class="b b-dest">Satıldı</span>
<span class="b b-warn">Beklemede</span>
<span class="b b-info">Akademik</span>
<span class="b b-neutral">CS301</span>
<span class="b b-neutral">Güz 2025</span>
<span class="b b-solid">Vurgu</span>
</body></html>

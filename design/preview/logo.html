<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border-radius:8px;padding:24px;display:flex;align-items:center;justify-content:center;border:1px solid #E2E8F0;min-height:80px}
.dark{background:#0F172A;border-color:#1E293B}
.tag{font:500 11px var(--font-mono);color:#64748B;margin-top:6px;text-align:center}
.col{display:flex;flex-direction:column}
</style></head><body>
<div class="col"><div class="box"><img src="../assets/logo.svg" alt="" height="36"></div><div class="tag">logo · light</div></div>
<div class="col"><div class="box dark"><img src="../assets/logo-dark.svg" alt="" height="36"></div><div class="tag">logo · dark</div></div>
<div class="col"><div class="box"><img src="../assets/app-icon.svg" alt="" height="56"></div><div class="tag">app icon · 64</div></div>
<div class="col"><div class="box dark"><img src="../assets/app-icon.svg" alt="" height="32"></div><div class="tag">app icon · 32</div></div>
</body></html>

<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:24px;background:#F8FAFC;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.b{height:80px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:hsl(var(--muted-foreground))}</style></head><body>
<div class="b" style="box-shadow:var(--shadow-xs)">xs</div>
<div class="b" style="box-shadow:var(--shadow-sm)">sm</div>
<div class="b" style="box-shadow:var(--shadow-md)">md</div>
<div class="b" style="box-shadow:var(--shadow-lg)">lg</div>
<div class="b" style="box-shadow:var(--shadow-xl)">xl</div>
</body></html>

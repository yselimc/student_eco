<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{padding:20px;background:#F8FAFC;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:16px;box-shadow:var(--shadow-sm)}
.card.hover{border-color:#DDD6FE;box-shadow:var(--shadow-md)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{font:600 16px var(--font-sans);color:#0F172A;letter-spacing:-0.01em}
.meta{font:400 13px var(--font-sans);color:#64748B;margin-top:4px}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font:600 11px var(--font-sans);background:#F5F3FF;color:#6D28D9;border:1px solid #DDD6FE;letter-spacing:0.02em;text-transform:uppercase}
.foot{font:500 12px var(--font-mono);color:#64748B;margin-top:12px;display:flex;gap:8px;align-items:center}
</style></head><body>
<div class="card">
  <div class="row"><div class="title">Algoritmalar — vize özeti</div><span class="tag">PDF</span></div>
  <div class="meta">CS301 · Güz 2025 · Ayşe K.</div>
  <div class="foot">512 KB · 142 indirme</div>
</div>
<div class="card hover">
  <div class="row"><div class="title">Doğrusal cebir formül kağıdı</div><span class="tag">PDF</span></div>
  <div class="meta">MATH210 · Bahar 2025 · Carol L.</div>
  <div class="foot">100 KB · hover durumu</div>
</div>
</body></html>

<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Colors — neutral</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .sw { border-radius: var(--r-md); border: 1px solid hsl(var(--border)); overflow: hidden; }
  .chip { height: 56px; }
  .meta { padding: 6px 8px; background: hsl(var(--card)); }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: hsl(var(--muted-foreground)); }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F8FAFC"></div><div class="meta"><div class="name">slate-50</div><div class="hex">#F8FAFC</div></div></div>
  <div class="sw"><div class="chip" style="background:#F1F5F9"></div><div class="meta"><div class="name">slate-100</div><div class="hex">#F1F5F9</div></div></div>
  <div class="sw"><div class="chip" style="background:#E2E8F0"></div><div class="meta"><div class="name">slate-200</div><div class="hex">#E2E8F0</div></div></div>
  <div class="sw"><div class="chip" style="background:#CBD5E1"></div><div class="meta"><div class="name">slate-300</div><div class="hex">#CBD5E1</div></div></div>
  <div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="meta"><div class="name">slate-400</div><div class="hex">#94A3B8</div></div></div>
  <div class="sw"><div class="chip" style="background:#64748B"></div><div class="meta"><div class="name">slate-500</div><div class="hex">#64748B</div></div></div>
  <div class="sw"><div class="chip" style="background:#475569"></div><div class="meta"><div class="name">slate-600</div><div class="hex">#475569</div></div></div>
  <div class="sw"><div class="chip" style="background:#334155"></div><div class="meta"><div class="name">slate-700</div><div class="hex">#334155</div></div></div>
  <div class="sw"><div class="chip" style="background:#1E293B"></div><div class="meta"><div class="name">slate-800</div><div class="hex">#1E293B</div></div></div>
  <div class="sw"><div class="chip" style="background:#0F172A"></div><div class="meta"><div class="name">slate-900</div><div class="hex">#0F172A</div></div></div>
  <div class="sw"><div class="chip" style="background:#020617"></div><div class="meta"><div class="name">slate-950</div><div class="hex">#020617</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF;border-right:1px solid #E2E8F0"></div><div class="meta"><div class="name">white</div><div class="hex">#FFFFFF · bg</div></div></div>
</div>
</body></html>

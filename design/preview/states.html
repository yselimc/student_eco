<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>States</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.lbl{font:500 11px var(--font-mono);color:#64748B;width:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-sans);background:#7C3AED;color:#fff;border:none}
.btn.hover{background:#6D28D9}
.btn.active{background:#5B21B6}
.btn.focus{background:#7C3AED;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(124,58,237,.6)}
.btn.dis{opacity:.5}
</style></head><body>
<div class="row"><div class="lbl">rest</div><button class="btn">Not yükle</button></div>
<div class="row"><div class="lbl">hover</div><button class="btn hover">Not yükle</button></div>
<div class="row"><div class="lbl">active</div><button class="btn active">Not yükle</button></div>
<div class="row"><div class="lbl">focus</div><button class="btn focus">Not yükle</button></div>
<div class="row"><div class="lbl">disabled</div><button class="btn dis">Not yükle</button></div>
</body></html>

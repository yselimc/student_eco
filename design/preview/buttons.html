<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{padding:20px;background:#fff}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font:600 14px var(--font-sans);border:1px solid transparent;cursor:pointer;transition:all 120ms var(--ease-out);white-space:nowrap}
.b-primary{background:#7C3AED;color:#fff}
.b-primary:hover{background:#6D28D9}
.b-secondary{background:#F1F5F9;color:#0F172A}
.b-outline{background:#fff;color:#0F172A;border-color:#E2E8F0}
.b-outline:hover{background:#F5F3FF;border-color:#DDD6FE;color:#6D28D9}
.b-ghost{background:transparent;color:#0F172A}
.b-ghost:hover{background:#F5F3FF;color:#6D28D9}
.b-destructive{background:#EF4444;color:#fff}
.b-link{background:transparent;color:#7C3AED;text-decoration:underline;text-underline-offset:4px;padding:0}
.sz-sm{height:36px;padding:0 12px;font-size:13px}
.sz-lg{height:44px;padding:0 24px;font-size:15px}
.sz-icon{height:40px;width:40px;padding:0}
</style></head><body>
<div class="row">
  <button class="btn b-primary">Not yükle</button>
  <button class="btn b-secondary">Vazgeç</button>
  <button class="btn b-outline">İlana git</button>
  <button class="btn b-ghost">Daha sonra</button>
  <button class="btn b-destructive">Sil</button>
  <button class="btn b-link">Devamını oku</button>
</div>
<div class="row">
  <button class="btn b-primary sz-sm">Küçük</button>
  <button class="btn b-primary">Varsayılan</button>
  <button class="btn b-primary sz-lg">Büyük</button>
  <button class="btn b-outline sz-icon" aria-label="ara">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
  </button>
  <button class="btn b-primary" disabled style="opacity:.5;pointer-events:none">Yükleniyor…</button>
</div>
</body></html>

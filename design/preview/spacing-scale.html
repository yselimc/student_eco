<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:20px;display:flex;flex-direction:column;gap:6px}.r{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;color:hsl(var(--muted-foreground))}.bar{height:14px;background:#7C3AED;border-radius:2px}.tag{min-width:46px}.px{min-width:42px;color:hsl(var(--foreground))}</style></head><body>
<div class="r"><span class="tag">1</span><span class="px">4 px</span><div class="bar" style="width:4px"></div></div>
<div class="r"><span class="tag">2</span><span class="px">8 px</span><div class="bar" style="width:8px"></div></div>
<div class="r"><span class="tag">3</span><span class="px">12 px</span><div class="bar" style="width:12px"></div></div>
<div class="r"><span class="tag">4</span><span class="px">16 px</span><div class="bar" style="width:16px"></div></div>
<div class="r"><span class="tag">6</span><span class="px">24 px</span><div class="bar" style="width:24px"></div></div>
<div class="r"><span class="tag">8</span><span class="px">32 px</span><div class="bar" style="width:32px"></div></div>
<div class="r"><span class="tag">12</span><span class="px">48 px</span><div class="bar" style="width:48px"></div></div>
<div class="r"><span class="tag">16</span><span class="px">64 px</span><div class="bar" style="width:64px"></div></div>
</body></html>

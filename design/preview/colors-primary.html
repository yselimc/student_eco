<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Colors — primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: var(--r-md); border: 1px solid hsl(var(--border)); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; background: hsl(var(--card)); }
  .name { font-size: 13px; font-weight: 600; color: hsl(var(--foreground)); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F5F3FF"></div><div class="meta"><div class="name">purple-50</div><div class="hex">#F5F3FF · soft</div></div></div>
  <div class="sw"><div class="chip" style="background:#DDD6FE"></div><div class="meta"><div class="name">purple-200</div><div class="hex">#DDD6FE · hover bd</div></div></div>
  <div class="sw"><div class="chip" style="background:#A78BFA"></div><div class="meta"><div class="name">purple-400</div><div class="hex">#A78BFA</div></div></div>
  <div class="sw"><div class="chip" style="background:#7C3AED"></div><div class="meta"><div class="name">purple-600</div><div class="hex">#7C3AED · primary</div></div></div>
  <div class="sw"><div class="chip" style="background:#6D28D9"></div><div class="meta"><div class="name">purple-700</div><div class="hex">#6D28D9 · strong</div></div></div>
</div>
</body></html>
